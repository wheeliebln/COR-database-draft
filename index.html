<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corrections Database</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #080d12;
        color: #e7edf2;
        font-family: Arial, sans-serif;
    }

    /* MAIN CONTAINER */
    .app {
        width: 95%;
        height: 90vh;
        margin: 5vh auto;
        background: #111922;
        border: 1px solid #263746;
        border-radius: 8px;
        overflow: hidden;
    }

    /* HEADER */
    .header {
        height: 65px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border-bottom: 1px solid #263746;
        background: #0e151d;
    }

    .header-title {
        font-size: 20px;
        font-weight: bold;
    }

    .header-subtitle {
        margin-left: 15px;
        color: #8293a3;
        font-size: 13px;
    }

    /* MAIN CONTENT */
    .main {
        height: calc(100% - 65px);
        display: grid;
        grid-template-columns: 1fr 320px;
    }

    /* MAP */
    .map-panel {
        position: relative;
        overflow: hidden;
        background: #080d11;
        border-right: 1px solid #263746;
    }

    .map-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    /*
        ==================================================
        MAP IMAGE

        Replace the text below with your image URL.

        Example:

        src="https://example.com/map.png"

        ==================================================
    */

    /* MARKERS */
    .marker {
        position: absolute;

        width: 18px;
        height: 18px;

        border-radius: 50%;

        background: #0d1820;

        transform: translate(-50%, -50%);

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 8px;
        color: white;
    }

    .marker.blue {
        border: 2px solid #38a8e8;
    }

    .marker.red {
        border: 2px solid #ef6848;
    }

    .marker:hover {
        transform: translate(-50%, -50%) scale(1.2);
    }

    /* CHANGE THESE TO MOVE MARKERS */

    #marker1 {
        left: 40%;
        top: 40%;
    }

    #marker2 {
        left: 55%;
        top: 55%;
    }

    #marker3 {
        left: 70%;
        top: 35%;
    }

    /* RIGHT SIDE */
    .side {
        display: grid;
        grid-template-rows: 45% 55%;
        background: #0e151d;
    }

    /* NAME LIST */
    .people {
        border-bottom: 1px solid #263746;
        overflow-y: auto;
    }

    .section-title {
        padding: 15px;
        font-size: 12px;
        color: #8293a3;
        border-bottom: 1px solid #263746;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .person {
        padding: 15px;
        border-bottom: 1px solid #1d2a35;
        cursor: pointer;
        color: #e7edf2;
    }

    .person:hover {
        background: #16222d;
    }

    .person.selected {
        background: #192a36;
        border-left: 3px solid #38a8e8;
    }

    /* PROFILE */
    .profile {
        padding: 20px;
        overflow-y: auto;
    }

    .profile-name {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    /* IMAGE PLACEHOLDER */
    .profile-image {
        width: 120px;
        height: 150px;

        border: 1px solid #263746;
        background: #080d12;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #8293a3;
        font-size: 11px;

        margin-bottom: 15px;
    }

    .profile-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* DESCRIPTION */
    .profile-description {
        color: #b7c2cc;
        font-size: 14px;
        line-height: 1.6;
    }

    /* MODIFY BUTTON */
    .modify {
        color: #38a8e8;
        font-size: 11px;
        margin-left: 8px;
    }
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">

        <div class="header-title">
            MODIFY
        </div>

        <div class="header-subtitle">
            MODIFY
        </div>

    </div>


    <div class="main">

        <!-- ========================= -->
        <!-- MAP -->
        <!-- ========================= -->

        <div class="map-panel">

            <!--
                PASTE YOUR MAP IMAGE LINK HERE

                Example:
                https://example.com/map.png
            -->

            <img
                class="map-image"
                src="https://kommodo.ai/i/9y76w6Si1aZc61f6s1zM"
                alt="MODIFY"
            >


            <!-- MARKER 1 -->
            <div
                class="marker blue"
                id="marker1"
                onclick="selectPerson(0)"
            >
                MODIFY
            </div>


            <!-- MARKER 2 -->
            <div
                class="marker blue"
                id="marker2"
                onclick="selectPerson(1)"
            >
                MODIFY
            </div>


            <!-- MARKER 3 -->
            <div
                class="marker red"
                id="marker3"
                onclick="selectPerson(2)"
            >
                MODIFY
            </div>

        </div>


        <!-- ========================= -->
        <!-- RIGHT SIDE -->
        <!-- ========================= -->

        <div class="side">


            <!-- NAME LIST -->

            <div class="people">

                <div class="section-title">
                    PERSONNEL
                    <span class="modify">MODIFY</span>
                </div>


                <div
                    class="person"
                    onclick="selectPerson(0)"
                >
                    MODIFY
                </div>


                <div
                    class="person"
                    onclick="selectPerson(1)"
                >
                    MODIFY
                </div>


                <div
                    class="person"
                    onclick="selectPerson(2)"
                >
                    MODIFY
                </div>

            </div>


            <!-- PROFILE -->

            <div
                class="profile"
                id="profile"
            >

                <div class="profile-name">
                    MODIFY
                </div>


                <!-- IMAGE -->

                <div class="profile-image">
                    MODIFY IMAGE
                </div>


                <!-- DESCRIPTION -->

                <div class="profile-description">
                    MODIFY THIS PARAGRAPH. Put whatever information you want here.
                    This is the main profile description area and can be changed
                    for each person.
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/*
==================================================
MODIFY THE PEOPLE HERE
==================================================
*/

const people = [

    {
        name: "MODIFY",
        image: "",
        description: "MODIFY THIS PARAGRAPH."
    },

    {
        name: "MODIFY",
        image: "",
        description: "MODIFY THIS PARAGRAPH."
    },

    {
        name: "MODIFY",
        image: "",
        description: "MODIFY THIS PARAGRAPH."
    }

];


/*
==================================================
DO NOT NEED TO CHANGE BELOW THIS LINE
==================================================
*/

function selectPerson(index) {

    const person = people[index];

    /*
        Highlight selected name
    */

    document.querySelectorAll(".person").forEach((element, i) => {

        element.classList.toggle(
            "selected",
            i === index
        );

    });


    /*
        Create profile
    */

    let imageHTML = "";

    if (person.image !== "") {

        imageHTML = `
            <img
                src="${person.image}"
                alt="Profile Image"
            >
        `;

    } else {

        imageHTML = "MODIFY IMAGE";

    }


    document.getElementById("profile").innerHTML = `

        <div class="profile-name">
            ${person.name}
        </div>

        <div class="profile-image">
            ${imageHTML}
        </div>

        <div class="profile-description">
            ${person.description}
        </div>

    `;

}

</script>

</body>
</html>
